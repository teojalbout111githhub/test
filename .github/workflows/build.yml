name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuietFeed-apk
          path: QuietFeed.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest QuietFeed.apk --title "Quiet Feed" --notes "Open QuietFeed.apk on your phone to install."
